<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registro - MegaCine</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba") no-repeat center/cover;
            height: 100vh;
        }

        .overlay {
            background: rgba(0,0,0,0.85);
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .registro-box {
            background: rgba(20,20,20,0.95);
            padding: 40px;
            border-radius: 12px;
            width: 320px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.7);
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #e50914;
            margin-bottom: 10px;
        }

        .sub {
            color: #ccc;
            font-size: 14px;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: none;
            background: #333;
            color: white;
        }

        input:focus {
            outline: none;
            background: #444;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e50914;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #f6121d;
            transform: scale(1.03);
        }

        .links {
            margin-top: 15px;
            font-size: 14px;
        }

        .links a {
            color: #ffcc00;
            text-decoration: none;
            display: block;
            margin-top: 5px;
        }

        .links a:hover {
            color: white;
        }

    </style>
</head>

<body>

<div class="overlay">
    <div class="registro-box">

        <h1>🎬 MegaCine</h1>
        <div class="sub">Crea tu cuenta para reservar</div>

        <form action="/registro" method="post">

            <input type="text" name="nombre" placeholder="Nombre completo" required>

            <input type="email" name="correo" placeholder="Correo electrónico" required>

            <input type="password" name="password" placeholder="Contraseña" required>

            <button type="submit">Registrarse</button>

        </form>

        <div class="links">
            <a href="/loginUsuario">Ya tengo cuenta 🔐</a>
        </div>

    </div>
</div>

</body>
</html>
